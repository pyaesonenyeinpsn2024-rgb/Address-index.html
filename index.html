const KEY='nw_cards_v5';let cards=load(),selected=localStorage.getItem('nw_selected')||cards[0].id,imgs={photo:'',cover:'',logo:''};function uid(){return Date.now()+'-'+Math.random().toString(16).slice(2)}function starter(){return{id:uid(),slug:'pyae-sone',name:'Pyae Sone',title:'Founder & Managing Director',company:'Northern World Co., Ltd.',phone:'09264888995',viber:'09691888995',whatsapp:'',wechat:'',email:'northernworld.mm@gmail.com',website:'',address:'Moke Lwal Road, No.(5) Ward, Waingmaw Township, Kachin State, Myanmar.',about:'Northern World Co., Ltd. သည် Construction, Mining & Natural Resources, Import & Export Trading, Distribution & Logistics နှင့် General Services လုပ်ငန်းများကို ဆောင်ရွက်သည့် ကုမ္ပဏီဖြစ်ပါသည်။',facebook:'',instagram:'',telegram:'',tiktok:'',youtube:'',map:'',kbz:'40251199912610001',kbzpay:'',wave:'',aya:'',account:'',photo:'',cover:'',logo:'',template:'green',status:'active',paymentStatus:'unpaid',expiry:'',views:0,saves:0}}function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&d.length?d:[starter()]}catch{return[starter()]}}function save(){localStorage.setItem(KEY,JSON.stringify(cards))}function C(){return cards.find(x=>x.id===selected)||cards[0]}function el(x){return document.getElementById(x)}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function link(v){if(!v)return'#';if(/^(tel:|mailto:|viber:)/i.test(v))return v;return/^https?:\/\//i.test(v)?v:'https://'+v}function digits(v){return String(v||'').replace(/\D/g,'')}function pLink(c){let u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('card',c.slug);return u.toString()}function setImg(id,data){let i=el(id);if(data){i.src=data;i.classList.remove('hide')}else{i.removeAttribute('src');i.classList.add('hide')}}function render(c){selected=c.id;localStorage.setItem('nw_selected',selected);el('cardView').className='tpl-'+(c.template||'green');el('name').textContent=c.name;el( p class="text-slate-500">No accounts added.</p>';el('qr').innerHTML='';new QRCode(el('qr'),{text:pLink(c),width:230,height:230,colorDark:'#073f2d',colorLight:'#fff'})}function vcf(c){return ['BEGIN:VCARD','VERSION:3.0','FN:'+c.name,'TEL:'+c.phone,'EMAIL:'+c.email,'ORG:'+c.company,'TITLE:'+c.title,'ADR:;;'+c.address+';;;;','END:VCARD'].join('\r\n')}function blob(b,n){let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function downloadVCF(){let c=C();c.saves=(c.saves||0)+1;save();blob(new Blob([vcf(c)],{type:'text/vcard'}),c.slug+'.vcf')}function downloadQR(){let c=el('qr').querySelector('canvas'),i=el('qr').querySelector('img'),a=document.createElement('a');a.download=C().slug+'-qr.png';a.href=c?c.toDataURL():i.src;a.click()}async function copyText(v){await navigator.clipboard.writeText(decodeURIComponent(v));toast('Copied')}async function copyLink(){await navigator.clipboard.writeText(pLink(C()));toast('Link copied')}async function shareCard(){let c=C();if(navigator.share)navigator.share({title:c.name,url:pLink(c)});else copyLink()}function openManager(){el('manager').classList.remove('hide');renderList();loadForm(C())}function closeManager(){el('manager').classList.add('hide')}function renderList(){let q=(el('search').value||'').toLowerCase();el('list').innerHTML=cards.filter(c=>(c.name+c.company+c.slug).toLowerCase().includes(q)).map(c=>'<button onclick="selectCard(\''+c.id+'\')" class="w-full text-left p-3 rounded-2xl border '+(c.id===selected?'bg-emerald-50 border-emerald-500':'bg-white')+'"><b>'+esc(c.name)+'</b><p class="text-xs text-slate-500">'+esc(c.company)+'</p><div class="text-[10px] mt-1">'+c.status+' • '+c.paymentStatus+' • Views '+(c.views||0)+'</div></button>').join('')}function selectCard(id){selected=id;localStorage.setItem('nw_selected',id);renderList();loadForm(C())}function fields(){return['name','slug','title','company','phone','viber','whatsapp','wechat','email html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(c.name)+'</title><style>body{font-family:Arial;background:#eef2ed;margin:0}.hero{height:240px;background:#073f2d center/cover}.card{max-width:620px;margin:-70px auto 30px;background:white;border-radius:28px;padding:75px 22px 24px;text-align:center;position:relative}.photo{width:120px;height:120px;border-radius:28px;object-fit:cover;position:absolute;top:-60px;left:50%;transform:translateX(-50%);border:5px solid #d6aa3b}.btn{display:inline-block;padding:12px 18px;background:#073f2d;color:white;text-decoration:none;border-radius:14px;margin:5px}.row{text-align:left;background:#f5f7f3;padding:12px;border-radius:12px;margin:8px}</style></head><body><div id="hero" class="hero"></div><div class="card"><img id="p" class="photo"><h1 id="n"></h1><p id="t"></p><p id="co"></p><a id="call" class="btn">Call</a><a id="save" class="btn">Save Contact</a><div id="rows"></div></div><script>const c='+data+';const $=x=>document.getElementById(x);if(c.cover)$("hero").style.backgroundImage="url("+c.cover+")";if(c.photo)$("p").src=c.photo;else $("p").style.display="none";$("n").textContent=c.name;$("t").textContent=c.title;$("co").textContent=c.company;$("call").href="tel:"+c.phone;const r=[["Phone",c.phone],["Viber",c.viber],["WhatsApp",c.whatsapp],["WeChat",c.wechat],["Email",c.email],["Address",c.address]].filter(x=>x[1]);$("rows").innerHTML=r.map(x=>`<div class="row"><b>${x[0]}</b><br>${x[1]}</div>`).join("");const v=["BEGIN:VCARD","VERSION:3.0","FN:"+c.name,"TEL:"+c.phone,"EMAIL:"+c.email,"ORG:"+c.company,"END:VCARD"].join("\\r\\n");$("save").href=URL.createObjectURL(new Blob([v],{type:"text/vcard"}));$("save").download=c.slug+".vcf";<\\/script></body></html>';blob(new Blob([h],{type:'text/html'}),c.slug+'-index.html')}function toast(m){el('toast').textContent=m;el('toast').classList.remove('hide');setTimeout(()=>el('toast').classList.add('hide'),2200)}let qs=new URL
